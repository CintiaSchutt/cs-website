<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f8eee7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#202020" media="(prefers-color-scheme: dark)" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!--
      Applies a saved light/dark choice before first paint (no flash). It is an external
      file because the Content-Security-Policy only allows scripts from this site.
    -->
    <script src="/theme-init.js"></script>

    <!--
      Instrument Serif and Instrument Sans from Google Fonts: the only third-party
      requests the site makes, and the only ones its Content-Security-Policy allows
      (see scripts/postbuild.mjs). To stop sending visitors' requests to Google,
      self-host the two families: see README.md, "Fonts".
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Instrument+Serif:ital@0;1&display=swap"
    />

    <!--
      Page-specific tags live between these markers. scripts/postbuild.mjs
      rewrites this block for every route after `vite build`, so each page
      ships with its own title and description. The values below are the
      home page (keep them in sync with src/content/pages.json).
    -->
    <!--page-meta:start-->
    <title>Cintia Schutt | Software developer specializing in identity</title>
    <meta name="description" content="Software developer in Calgary who specializes in identity: OAuth 2.0 and OpenID Connect sign-in for healthcare software. Open to developer and identity and access management roles." />
    <link rel="canonical" href="https://cintiaschutt.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cintia Schutt" />
    <meta property="og:locale" content="en_CA" />
    <meta property="og:title" content="Cintia Schutt | Software developer specializing in identity" />
    <meta property="og:description" content="Software developer in Calgary who specializes in identity: OAuth 2.0 and OpenID Connect sign-in for healthcare software. Open to developer and identity and access management roles." />
    <meta property="og:url" content="https://cintiaschutt.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Cintia Schutt | Software developer specializing in identity" />
    <meta name="twitter:description" content="Software developer in Calgary who specializes in identity: OAuth 2.0 and OpenID Connect sign-in for healthcare software. Open to developer and identity and access management roles." />
    <!--page-meta:end-->
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p>
        <strong>Cintia Schutt</strong> is a software developer in Calgary, Canada, who specializes
        in identity. This site needs JavaScript to display its pages. To get in touch, email
        <a href="mailto:cintiaschutt@gmail.com">cintiaschutt@gmail.com</a> or find me on
        <a href="https://www.linkedin.com/in/cintia-schutt/">LinkedIn</a> and
        <a href="https://github.com/CintiaSchutt">GitHub</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
