# .github/workflows/deploy.yml
name: Deploy to GitHub Pages

# Pull requests to main are checked and built. Pushes to main are also deployed.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Least privilege by default: jobs can only read the repository.
permissions:
  contents: read

# One deploy at a time; a newer push waits instead of cancelling a deploy in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a full commit SHA (the version is in the comment),
      # so a moved or compromised tag cannot change what runs. Dependabot keeps them current.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Vite 7 needs Node 20.19+ or 22.12+
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      # Runs vite build, then scripts/postbuild.mjs
      - name: Build
        run: npm run build

      - name: Upload site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          # Keeps .well-known/security.txt in the published site
          include-hidden-files: true

  # Publishes with a short-lived token GitHub issues for this run. No stored secret.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
